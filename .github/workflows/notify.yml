name: Update the site

# When an app is shared, edited or taken down, ask the site to rebuild now
# instead of at its next hourly build. Needs the SITE_TOKEN secret: a
# fine-grained token for rodion-b/vibecodingfaces-site with "Actions: read and
# write" only. Without it this does nothing and the hourly build catches up.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to rebuild
        env:
          TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No SITE_TOKEN secret yet; the site picks this up at its next hourly build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rodion-b/vibecodingfaces-site/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
